<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>jobmap</title>
<!-- Family mark: same rounded-square badge as ORCA/priority-guide. Color is
     this app's own --ok green (signed-off green, shared across the suite);
     glyph is a checkmark — a job signed off, the thing jobmap tracks. -->
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='rgb(23,114,69)'/><path d='M9 17L14 22L23 10' fill='none' stroke='white' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/></svg>">
<style>
:root{
  /* Palette reconciled from shared/tokens.css (design-utilities repo) — the
     source of truth for ORCA/jobmap/priority-guide. This is a manually-synced
     copy, not an @import (none of the three apps takes on a build step); see
     that file's README for how to re-check this block for drift. */
  --bg:#f6f7f9; --panel:#fff; --ink:#16181d; --dim:#6b7280; --faint:#9aa1ac;
  --line:rgba(16,18,22,.11); --line-2:rgba(16,18,22,.2);
  /* jobmap-specific, not part of the shared token set. */
  --hover:rgba(16,18,22,.05); --hdr-h:52px;
  --accent:#2563eb; --accent-soft:rgba(37,99,235,.10); --on-accent:#fff;
  --warn:#9a6700; --warn-soft:rgba(154,103,0,.11);
  --danger:#d0342c; --danger-soft:rgba(208,52,44,.09);
  --ok:#177245; --ok-soft:rgba(23,114,69,.11); --on-ok:#fff;
  --flag:#b8541f; --act:#b3261e; --none:#8a8f98;
  --t-micro:11px; --t-small:12.5px; --t-body:13.5px; --t-ui:14px; --t-title:16px;
  --t-lede:17px; --t-display:28px; --t-hero:38px;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:28px; --s7:96px;
  --radius:10px; --radius-sm:7px; --ease:cubic-bezier(.22,.61,.36,1);
  --shadow-sm:0 1px 2px rgba(16,18,22,.04), 0 14px 34px -22px rgba(16,18,22,.30);
  --mono:ui-monospace, SFMono-Regular, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme=light]) {
    --bg:#16171a; --panel:#1f2024; --ink:#f5f5f7; --dim:#98989d; --faint:#7c7c84;
    --line:rgba(255,255,255,.13); --line-2:rgba(255,255,255,.2);
    --hover:rgba(255,255,255,.08);
    --accent:#0a84ff; --accent-soft:rgba(10,132,255,.16); --on-accent:#fff;
    --warn:#e0b25a; --warn-soft:rgba(224,178,90,.13);
    --danger:#ff453a; --danger-soft:rgba(255,69,58,.14);
    --ok:#30d158; --ok-soft:rgba(48,209,88,.14); --on-ok:#0e1a14;
    --flag:#ff9c52; --act:#ff6b5c; --none:#969ba6;
    --shadow-sm:0 1px 2px rgba(0,0,0,.3), 0 14px 34px -22px rgba(0,0,0,.6);
  }
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font:var(--t-body)/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased}
button{font:inherit;border:0;background:none;color:inherit;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- header ---------- */
#bar{display:flex;align-items:center;gap:14px;height:var(--hdr-h);padding:0 var(--s4);
  background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
#bar .brand{font-weight:600;letter-spacing:-.01em}
#bar .file{color:var(--dim);white-space:nowrap;max-width:28ch;cursor:pointer;padding:var(--s1) var(--s2);
  border-radius:7px;display:flex;align-items:center;gap:6px;margin-left:-8px;
  border:0;background:none;font:inherit}
#bar .file span{overflow:hidden;text-overflow:ellipsis}
#bar .file svg{color:var(--faint);flex:none}
#bar .file:hover svg{color:var(--ink)}
#bar .file:hover{background:var(--hover);color:var(--ink)}
#bar .spacer{flex:1}
.tabs{display:flex;gap:2px;background:var(--hover);padding:3px;border-radius:9px}
.tabs button{padding:5px var(--s3);border-radius:7px;color:var(--dim);font-size:var(--t-small);font-weight:500}
.tabs button:hover{color:var(--ink)}
.tabs button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.btn{padding:6px var(--s3);border-radius:8px;font-size:var(--t-small);font-weight:500;color:var(--dim)}
.btn.big{padding:10px 18px;font-size:var(--t-ui);display:inline-flex;align-items:center}
.btn:hover{background:var(--hover);color:var(--ink)}
.btn.on{background:var(--ink);color:var(--panel)}
.btn.on:hover{background:var(--ink);filter:brightness(1.35)}
.btn.primary{background:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn[disabled]{opacity:.4;pointer-events:none}
.coverage{color:var(--dim);font-size:var(--t-small);font-variant-numeric:tabular-nums}
.coverage.none{color:var(--warn)}
.coverage b{color:var(--ok);font-weight:600}
.quiet{color:var(--faint);font-size:12px}
.quiet:hover{color:var(--dim);text-decoration:underline}

/* ---------- banners ---------- */
#banners{position:sticky;top:var(--hdr-h);z-index:4}
.banner{padding:9px var(--s4);font-size:var(--t-small);border-bottom:1px solid var(--line)}
.banner.err{background:#fdf1ef;color:#8a2d16}
.banner.warn{background:#fdf8ec;color:#7a5b00}
.banner.info{background:#eef4ff;color:#1b3f8f}
.banner b{font-weight:600}
.banner button{margin-left:10px;text-decoration:underline}

/* ---------- layout ---------- */
main{height:calc(100% - var(--hdr-h));display:flex;min-height:0}
#stage{flex:1;min-width:0;height:100%;overflow-y:auto;padding:26px 26px 90px}
.wrap{max-width:1060px}

/* ---------- shared bits ---------- */
.chip{display:inline-flex;align-items:center;gap:var(--s1);padding:1px 7px;border-radius:99px;
  font-size:var(--t-micro);font-weight:500;white-space:nowrap}
.c-none{background:var(--hover);color:var(--faint)}
.chip.signed{background:rgba(23,114,69,.12);color:var(--ok)}
.chip.who{background:var(--hover);color:var(--dim)}

/* ---------- sign-off ---------- */
.signrow{display:flex;align-items:center;gap:10px;margin:18px 0 0;padding:11px 13px;
  border:1px solid var(--line);border-radius:11px;cursor:pointer;font-size:var(--t-body);background:var(--panel)}
.signrow:hover{border-color:var(--none)}
.signrow.on{border-color:var(--ok);background:rgba(23,114,69,.06)}
.signrow input{width:17px;height:17px;accent-color:var(--ok);cursor:pointer;flex:none}
.signrow b{font-weight:600}
.signwhen{color:var(--dim);font-weight:400}
.chip.flag{background:rgba(184,84,31,.12);color:var(--flag)}
.chip.stage{background:var(--hover);color:var(--dim);font-variant-numeric:tabular-nums}
h2.section{font-size:15px;font-weight:600;margin:26px 0 var(--s1);letter-spacing:-.01em}
h2.section:first-child{margin-top:0}
.sub{color:var(--dim);font-size:var(--t-small);margin:0 0 var(--s3)}
.titlehint{color:var(--faint);font-size:12px;line-height:1.5;margin:-2px 0 var(--s4);max-width:640px}
.titlehint b{color:var(--dim);font-weight:600}
.titlehint.stmthint{margin-top:20px}
.titlehint i{font-style:italic;color:var(--dim)}
.empty{color:var(--faint);padding:22px 0;font-size:13px}

/* ---------- jobs view ---------- */
.job-row{display:flex;gap:10px;align-items:baseline;padding:11px var(--s3);border-radius:10px;cursor:pointer}
.job-row:hover{background:var(--hover)}
.job-row.on{background:var(--accent-soft)}
.job-row .t{flex:1;min-width:0}
.job-row .t b{font-weight:500}
.job-row .today{display:block;color:var(--faint);font-size:11.5px;margin-top:3px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.headline-note{color:var(--warn);font-size:13px;margin:0 0 22px;padding:9px 13px;
  background:#fdf8ec;border-radius:9px;display:inline-block}

/* ---------- map view ---------- */
.mapwrap{overflow-x:auto;padding-bottom:var(--s3)}
.stages{display:flex;gap:9px}
.stagecol{flex:1 1 0;min-width:118px;background:var(--panel);border:1px solid var(--line);
  border-radius:11px;padding:10px;min-height:132px}
.stagecol h4{margin:0 0 var(--s2);font-size:var(--t-micro);font-weight:600;letter-spacing:.04em;
  text-transform:uppercase;color:var(--dim);display:flex;justify-content:space-between}
.stagecol.bare{background:transparent;border-style:dashed}
.stagecol h4 .q{cursor:help;color:var(--faint);font-weight:400}
.stagehelp{color:var(--faint);font-size:var(--t-micro);line-height:1.4;margin:0 0 var(--s2)}
.addstep{width:100%;border:1px dashed var(--line);background:none;color:var(--faint);
  border-radius:8px;padding:7px 6px;font:inherit;font-size:11.5px;cursor:pointer}
.addstep:hover{border-style:solid;border-color:var(--accent);color:var(--accent);
  background:var(--accent-soft)}
.mapintro{max-width:760px;color:var(--dim);font-size:13px;line-height:1.55;margin:0 0 14px}
.mapintro b{color:var(--ink);font-weight:600}
.stagecol .gap{color:var(--faint);font-size:11.5px;line-height:1.45}
.stepcard{background:var(--bg);border-radius:8px;padding:var(--s2);margin-bottom:7px;cursor:pointer;font-size:12px}
.stepcard:hover{background:var(--accent-soft)}
.pickrow{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:var(--s4);align-items:center}
.picker{position:relative;display:inline-block;max-width:100%}
.picklbl{display:block;font-size:var(--t-micro);font-weight:600;letter-spacing:.05em;
  text-transform:uppercase;color:var(--faint);margin:0 0 5px}
.rootpick{display:inline-flex;align-items:center;gap:9px;font-size:19px;font-weight:600;
  letter-spacing:-.015em;color:var(--ink);padding:7px 13px;max-width:100%;
  border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.rootpick:hover{border-color:var(--accent);background:var(--accent-soft)}
.rootpick span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rootpick i{flex:0 0 auto;width:0;height:0;border-left:4.5px solid transparent;
  border-right:4.5px solid transparent;border-top:5px solid var(--faint);margin-top:3px}
.rootpick:hover{color:var(--accent)}
.rootpick:hover i{border-top-color:var(--accent)}
.pickmenu{display:none;position:absolute;top:calc(100% + 7px);left:-10px;z-index:9;
  background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:5px;
  box-shadow:0 10px 30px rgba(0,0,0,.13);max-height:60vh;overflow-y:auto;min-width:340px}
.picker.open .pickmenu{display:block}
.pickitem{display:flex;gap:var(--s3);align-items:center;width:100%;text-align:left;padding:7px 10px;
  border-radius:8px;font-size:13px;color:var(--dim)}
.pickitem span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pickitem b{color:var(--accent);font-variant-numeric:tabular-nums;font-size:11.5px}
.pickitem:hover{background:var(--hover);color:var(--ink)}
.pickitem.on{color:var(--ink);font-weight:500}
.pick{padding:5px 11px;border-radius:99px;border:1px solid var(--line);font-size:12px;color:var(--dim)}
.pick:hover{background:var(--hover);color:var(--ink)}
.pick.on{background:var(--ink);color:var(--panel);border-color:var(--ink)}

/* ---------- card view ---------- */
.card{max-width:880px}
.card .title{font-size:19px;font-weight:600;width:100%;border:0;background:none;padding:var(--s1) 0;letter-spacing:-.015em}
.stmt{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:15px 17px;margin:14px 0 0}
.stmt label{display:block;font-size:var(--t-micro);font-weight:600;letter-spacing:.04em;text-transform:uppercase;
  color:var(--faint);margin-bottom:3px}
.stmt textarea{width:100%;border:0;background:none;resize:none;padding:0;overflow:hidden;
  min-height:0;line-height:1.45;display:block}
.stmt .part+.part{margin-top:13px}
.stmt label{margin-bottom:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:11px;margin:20px 0 0}
.f label{display:block;font-size:var(--t-micro);font-weight:600;letter-spacing:.04em;text-transform:uppercase;
  color:var(--faint);margin-bottom:var(--s1)}
.f input,.f select{width:100%;padding:6px var(--s2);border:1px solid var(--line);border-radius:8px;background:var(--panel)}
.f .hint{color:var(--faint);font-size:var(--t-micro);margin-top:var(--s1)}
.body-edit{width:100%;min-height:180px;padding:14px var(--s4);border:1px solid var(--line);border-radius:11px;
  background:var(--panel);font:var(--t-body)/1.62 inherit;font-family:inherit;resize:vertical}
.pair{display:grid;grid-template-columns:repeat(2,minmax(160px,220px));gap:11px;margin:14px 0 0}
.pair.one{grid-template-columns:minmax(160px,220px)}
.freq{display:flex;flex-wrap:wrap;align-items:center;gap:7px}
.freq .cell{width:auto;min-width:0}
.freq .kind{min-width:190px}
.freq .num{width:64px;text-align:center}
.freq .grow{flex:1;min-width:220px}
.freq-lbl{color:var(--faint);font-size:var(--t-small)}
.freq-out{margin-top:7px;font-size:12px;color:var(--faint)}
.freq-out::before{content:'writes ';}
.daybox{display:grid;grid-template-columns:repeat(11,26px);gap:3px;flex-basis:100%;margin-top:2px}
.day{width:26px;height:26px;border:1px solid var(--line);border-radius:6px;background:var(--panel);
  color:var(--dim);font:inherit;font-size:11.5px;cursor:pointer;font-variant-numeric:tabular-nums;padding:0}
.day:hover{border-color:var(--accent);color:var(--ink)}
.day.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.pairhint{color:var(--faint);font-size:var(--t-micro);margin:5px 0 0}
.nav{display:flex;align-items:center;gap:var(--s2);color:var(--dim);font-size:12px;margin-bottom:10px}
.nav .gap{flex:1}
.nav .back{padding:var(--s1) 9px;border-radius:7px;color:var(--dim)}
.nav .back:hover{background:var(--hover);color:var(--ink)}
.nav button{padding:2px var(--s2);border-radius:6px}
.nav button:hover{background:var(--hover)}
.flagbox{background:#fdf6f2;border:1px solid rgba(184,84,31,.25);border-radius:10px;padding:10px var(--s3);
  margin:var(--s3) 0;font-size:var(--t-small);color:#7a3a12}
.flagbox b{font-weight:600}

/* ---------- source view ---------- */
pre.src{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:var(--s4);
  font:12px/1.65 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;overflow-wrap:anywhere}

/* ---------- left rail: categories ----------
   Matching priority-guide's rail, deliberately: same 214px, same .rail-h, same
   item shape, same hover tools, same "+ New" at the foot. Two apps that do the
   same thing should not each invent it. */
#rail{width:214px;flex:none;border-right:1px solid var(--line);background:var(--panel);
  overflow-y:auto;padding:14px var(--s2) 40px}
body[data-present] #rail{display:none}
.rail-h{font-size:var(--t-micro);font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  color:var(--faint);padding:0 var(--s2) 7px}
.g-item{display:block;width:100%;text-align:left;padding:7px 9px;border-radius:8px;
  color:var(--dim);line-height:1.35;position:relative;cursor:pointer;border:0;background:none;font:inherit}
.g-item:hover{background:var(--hover);color:var(--ink)}
.g-item.on{background:var(--accent-soft);color:var(--ink)}
.g-item .n{font-weight:500;display:block;padding-right:var(--s4);overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.g-item .m{font-size:11.5px;color:var(--faint);font-variant-numeric:tabular-nums}
.g-item.on .m{color:var(--dim)}
.g-item .m .o{color:var(--flag);font-weight:600}
.gtools{position:absolute;right:5px;top:4px;display:flex;gap:1px;opacity:0;padding-left:14px;
  transition:opacity .1s;background:linear-gradient(90deg,transparent,var(--panel) 45%)}
.g-item.on .gtools{background:linear-gradient(90deg,transparent,var(--accent-soft) 45%)}
.g-item:hover .gtools,.g-item:focus-within .gtools{opacity:1}
.gtools button{color:var(--faint);padding:2px;border-radius:4px;display:flex;border:0;background:none;cursor:pointer}
.gtools button:hover{color:var(--ink);background:rgba(16,18,22,.08)}
.gtools button.danger:hover{color:var(--flag);background:rgba(184,84,31,.12)}
.gtools button:disabled{opacity:.25;cursor:default}
.rail-add{margin-top:6px;width:100%;text-align:left;padding:7px 9px;border-radius:8px;
  color:var(--faint);font-size:var(--t-small);border:0;background:none;cursor:pointer;font-family:inherit}
.rail-add:hover{background:var(--hover);color:var(--ink)}
/* The junk drawer reads as one: dashed, set apart, and it does not pretend to
   be a category somebody chose. */
.g-item.drawer{border:1px dashed var(--line);margin-top:14px;color:var(--faint)}
.g-item.drawer.on{border-style:solid}
.rail-sep{height:1px;background:var(--line);margin:var(--s3) var(--s2)}

/* ---------- roles view ---------- */
.g-title{font-size:23px;font-weight:600;letter-spacing:-.02em;margin:0 0 3px;line-height:1.25}
.blurb{color:var(--dim);font-size:13px;line-height:1.55;max-width:620px}
.drawer-note{margin-top:var(--s2);font-size:var(--t-small);color:var(--faint);border-left:2px dashed var(--line);
  padding-left:10px;max-width:620px}
.usr{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px;background:var(--panel)}
.usr.drawer{border-style:dashed;background:none}
.usr-h{display:flex;align-items:baseline;gap:10px;margin-bottom:var(--s2)}
.usr-h .n{font-size:15px;font-weight:600;letter-spacing:-.01em}
.usr-h .m{font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums}
.oi{display:flex;align-items:baseline;gap:10px;width:100%;text-align:left;padding:7px 9px;
  border-radius:8px;border:0;background:none;cursor:pointer;font:inherit;color:var(--ink)}
.oi:hover{background:var(--hover)}
.oi .t{flex:1;min-width:0;font-size:var(--t-body)}
.oi .c{font-size:11.5px;color:var(--faint);flex:none}
.rail-empty{color:var(--faint);font-size:var(--t-small);padding:6px 0;line-height:1.5}

/* ---------- depends-on chips ---------- */
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip.dep{background:var(--hover);color:var(--ink);padding:3px var(--s1) 3px 9px;gap:6px;font-size:12px}
.chip.dep .gone{color:var(--flag);font-size:10px;text-transform:uppercase;letter-spacing:.04em}
.chipx{border:0;background:none;color:var(--faint);padding:2px;border-radius:99px;cursor:pointer;display:flex}
.chipx:hover{background:rgba(184,84,31,.14);color:var(--flag)}
.depadd{border:1px dashed var(--line);border-radius:99px;background:none;color:var(--faint);
  font:inherit;font-size:12px;padding:3px var(--s2);cursor:pointer;max-width:24ch}
.depadd:hover{border-style:solid;border-color:var(--accent);color:var(--accent)}
.chips .none{color:var(--faint);font-size:var(--t-small)}
.grid.two{grid-template-columns:1fr 1fr}
.stmt-warn{margin:0 0 var(--s3);font-size:var(--t-small);color:var(--flag);background:rgba(184,84,31,.08);
  border-radius:8px;padding:var(--s2) 11px;line-height:1.5}
.stmt-warn b{font-weight:600}

/* ---------- dialog ---------- */
.scrim{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;
  padding:var(--s4);background:rgba(16,18,22,.34)}
.dlg{width:min(430px,100%);background:var(--panel);border:1px solid var(--line);border-radius:14px;
  padding:20px;box-shadow:0 18px 50px rgba(0,0,0,.24),0 2px 8px rgba(0,0,0,.10)}
.dlg h2{margin:0 0 var(--s2);font-size:var(--t-lede);font-weight:600;letter-spacing:-.01em}
.dlg p{margin:0 0 var(--s4);font-size:var(--t-body);color:var(--dim);line-height:1.55}
.dlg p b{color:var(--ink);font-weight:600}
.dlg input{width:100%;margin-bottom:var(--s4);padding:9px 11px;font:inherit;font-size:var(--t-ui);color:var(--ink);
  background:var(--bg);border:1px solid var(--line);border-radius:9px}
.dlg input:focus{outline:none;border-color:var(--accent)}
.dlg .acts{display:flex;justify-content:flex-end;gap:var(--s2)}
.dlg .acts .btn{padding:7px 14px;border:1px solid var(--line)}
.dlg .acts .btn.danger{background:var(--flag,#b8541f);border-color:var(--flag,#b8541f);color:#fff}
.dlg .acts .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}

/* ---------- delete ---------- */
.cardfoot{display:flex;justify-content:flex-end;border-top:1px solid var(--line);
  margin-top:30px;padding-top:14px}

<body>
<header id="bar"></header>
<div id="banners"></div>
<main><nav id="rail"></nav><section id="stage"></section></main>
<div id="capScrim">
  <div id="capture" role="dialog" aria-modal="true" aria-label="Capture a job">
    <h2>Capture</h2>
    <p class="caphint">Type what someone says, press <b>Enter</b>, and it becomes a job.
       The box clears and keeps focus, so you can take statements at the speed people talk.
       <b>Escape</b> closes.</p>
    <input id="capText" placeholder="Type what they said, then Enter" autocomplete="off">
    <div class="caprow">
      <select id="capGroup" title="Which group these land in"></select>
      <input id="capWho" placeholder="who said it" autocomplete="off">
    </div>
    <div id="capLint"></div>
    <div id="capRecent"></div>
    <div class="capfoot">
      <span id="capCount"></span>
      <button class="btn" id="capDone">Done</button>
    </div>
  </div>
</div>

<script type="module">
/*
 * jobmap — a jobs-to-be-done editor over a markdown file.
 *
 * The markdown is the source of truth. This app owns addressed spans inside it
 * and nothing else: it will not write a file it has not first proven it can
 * reproduce byte-for-byte, and it never reformats a line nobody edited.
 */
import {
  parseDocument, serializeDocument, verifyRoundTrip, allJobs, countJobs,
  parseStatement, renderStatement, lintJob, touch, blankJobsFile, UNASSIGNED,
  roles, unroled, groupsOf, renameGroup, moveGroup, moveJob, removeGroup, unassignedGroup,
  splitDeps, joinDeps, parseFrequency, renderFrequency,
  FREQ_UNITS, FREQ_ORDINALS, WEEKDAYS,
  addJob, addGroup, removeJob
} from './parser.js';

const $ = (id) => document.getElementById(id);

const S = {
  dir: null, files: [], file: null,
  doc: null, originalText: '', readOnly: false,
  view: 'jobs', sel: 0, group: null, dirty: false,
  present: false, capture: false, capGroup: null, captured: []
};

// ---------------------------------------------------------------- storage
const DB = 'jobmap';
function idb() {
  return new Promise((res, rej) => {
    const r = indexedDB.open(DB, 1);
    r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
async function kvGet(k) {
  const db = await idb();
  return new Promise((res) => {
    const t = db.transaction('kv').objectStore('kv').get(k);
    t.onsuccess = () => res(t.result);
    t.onerror = () => res(undefined);
  });
}
async function kvSet(k, v) {
  // Never let a storage failure break the thing the user actually asked for.
  // Remembering the folder is a convenience; opening it is the job.
  try {
    const db = await idb();
    return await new Promise((res) => {
      const t = db.transaction('kv', 'readwrite').objectStore('kv').put(v, k);
      t.oncomplete = () => res();
      t.onerror = () => res();
      t.onsuccess = () => res();
    });
  } catch { /* not persistable in this context */ }
}
/** Ten-deep backup ring, so a bad save is always recoverable. */
async function backup(name, text) {
  const ring = (await kvGet('backups')) || [];
  ring.unshift({ name, text, at: new Date().toISOString() });
  await kvSet('backups', ring.slice(0, 10));
}

// ---------------------------------------------------------------- banners
function banner(kind, html, sticky) {
  const el = document.createElement('div');
  el.className = 'banner ' + kind;
  el.innerHTML = html;
  if (!sticky) {
    const x = document.createElement('button');
    x.textContent = 'dismiss';
    x.onclick = () => el.remove();
    el.appendChild(x);
  }
  $('banners').appendChild(el);
  return el;
}
const clearBanners = () => { $('banners').innerHTML = ''; };

// ---------------------------------------------------------------- file access
async function pickFolder() {
  try {
    const dir = await window.showDirectoryPicker({ mode: 'readwrite' });
    S.dir = dir;
    await loadFolder();
    await kvSet('folder', dir);   // after, so a storage failure cannot block opening
  } catch (e) { if (e.name !== 'AbortError') banner('err', `<b>Could not open that folder.</b> ${e.message}`); }
}

async function ensureWritable(handle) {
  const opts = { mode: 'readwrite' };
  if ((await handle.queryPermission(opts)) === 'granted') return true;
  return (await handle.requestPermission(opts)) === 'granted';
}

async function loadFolder() {
  clearBanners();
  S.files = [];
  for await (const [name, h] of S.dir.entries()) {
    if (h.kind === 'file' && name.toLowerCase().endsWith('.md')) S.files.push({ name, handle: h });
  }
  S.files.sort((a, b) => a.name.localeCompare(b.name));

  // Probe each file once so the rail can say which hold jobs.
  for (const f of S.files) {
    try {
      const text = await (await f.handle.getFile()).text();
      f.jobs = countJobs(parseDocument(text));
    } catch { f.jobs = 0; }
  }

  const withJobs = S.files.filter((f) => f.jobs > 0);
  if (!S.files.length) {
    banner('warn', '<b>No markdown files here.</b> Point jobmap at a folder holding a jobs file.', true);
    render(); return;
  }
  if (withJobs.length === 1) return openFile(withJobs[0]);
  if (!withJobs.length) {
    banner('warn', '<b>No jobs files here.</b> These files round-trip but hold no <code>###</code> job blocks.', true);
  }
  render();
}

async function openFile(f) {
  clearBanners();
  const text = await (await f.handle.getFile()).text();
  const rt = verifyRoundTrip(text);
  S.file = f; S.originalText = text; S.doc = parseDocument(text);
  S.readOnly = !rt.ok; S.sel = 0; S.dirty = false;
  S.group = (groupsOf(S.doc)[0] || {}).name || null;
  S.capGroup = null; S.captured = [];

  if (!rt.ok) {
    banner('err', `<b>Read-only.</b> This file did not reproduce byte-for-byte on a test round-trip, `
      + `so jobmap will not write to it. First difference at line <code>${rt.line}</code>.<br>`
      + `expected <code>${esc(rt.expected)}</code><br>produced <code>${esc(rt.produced)}</code>`, true);
  } else if (!countJobs(S.doc)) {
    banner('warn', '<b>No jobs in this file.</b> It round-trips, but there are no <code>###</code> blocks to edit.', true);
  }
  render();
}

function esc(s) { const d = document.createElement('div'); d.textContent = String(s == null ? '' : s); return d.innerHTML; }

// ---------------------------------------------------------------- save
async function save() {
  if (!S.file || S.readOnly) return;
  commitActive();
  if (!(await ensureWritable(S.file.handle))) {
    banner('err', '<b>Write permission was declined.</b> Chrome needs <b>Edit files</b> for this folder.');
    return;
  }
  const onDisk = await (await S.file.handle.getFile()).text();
  if (onDisk !== S.originalText) {
    const keepMine = await ask({
      title: 'This file changed on disk',
      body: 'Something else wrote to it since you opened it \u2014 Obsidian, most likely. '
        + 'Overwriting replaces that version with yours.',
      ok: 'Overwrite', cancel: 'Discard mine and reload', danger: true
    });
    if (!keepMine) { return openFile(S.file); }
  }
  const text = serializeDocument(S.doc);
  const rt = verifyRoundTrip(text);
  if (!rt.ok) {
    banner('err', `<b>Refusing to save.</b> The output does not round-trip (line ${rt.line}). Nothing was written.`);
    return;
  }
  await backup(S.file.name, S.originalText);
  const w = await S.file.handle.createWritable();
  await w.write(text); await w.close();

  // Re-parse our own bytes so the model can never drift from the file.
  S.originalText = text;
  S.doc = parseDocument(text);
  S.dirty = false;
  render();
  const b = banner('info', '<b>Saved.</b>');
  setTimeout(() => b.remove(), 1600);
}

// ---------------------------------------------------------------- helpers
const jobs = () => (S.doc ? allJobs(S.doc) : []);
const cur = () => jobs()[S.sel] || null;
const today = () => new Date().toISOString().slice(0, 10);
const todayOf = (j) => plain((j.bodySrc.find((l) => /^Today:/i.test(l.trim())) || '').replace(/^Today:\s*/i, ''));

/** Strip markdown for display only. The file itself is never touched. */
function plain(s) {
  return String(s || '')
    .replace(/\[\[([^\]|]+)(\|[^\]]+)?\]\]/g, '$1')
    .replace(/\*\*([^*]+)\*\*/g, '$1')
    .replace(/\*([^*]+)\*/g, '$1')
    .replace(/`([^`]+)`/g, '$1')
    .replace(/\s+/g, ' ').trim();
}

function markDirty(job, what) { touch(job, what); S.dirty = true; }

/** Nothing may move under the cursor. */
function keepPlace(fn) {
  const a = document.activeElement;
  const key = a && a.dataset ? a.dataset.k : null;
  const ss = a && a.selectionStart, se = a && a.selectionEnd;
  const top = $('stage').scrollTop;
  fn();
  $('stage').scrollTop = top;
  if (key) {
    const next = $('stage').querySelector(`[data-k="${key}"]`);
    if (next) { next.focus(); try { next.setSelectionRange(ss, se); } catch {} }
  }
}

function commitActive() {
  const a = document.activeElement;
  if (a && a.dataset && a.dataset.k && a.onchange) a.onchange({ target: a });
}

// ---------------------------------------------------------------- render
function render() { renderBar(); renderRail(); renderStage(); }

/* The categories, and everything you can do to one. */
function renderRail() {
  const r = $('rail');
  r.innerHTML = '';
  if (!S.doc || S.present || (S.view !== 'jobs' && S.view !== 'card')) { r.style.display = 'none'; return; }
  r.style.display = '';
  r.appendChild(el('div', 'rail-h', 'Categories'));

  const gs = groupsOf(S.doc);
  const real = gs.filter((g) => g.name !== UNASSIGNED);
  const drawer = gs.find((g) => g.name === UNASSIGNED);

  const item = (g, isDrawer) => {
    const row = el('div', 'g-item' + (g.name === S.group ? ' on' : '') + (isDrawer ? ' drawer' : ''));
    row.tabIndex = 0;
    row.onclick = (e) => {
      if (e.target.closest('.gtools')) return;
      S.group = g.name; S.view = 'jobs'; render();
    };
    const name = el('div', 'n', g.name);
    name.title = isDrawer ? 'Jobs with no category yet' : g.name;
    row.appendChild(name);
    const n = g.jobs.length;
    const noRole = g.jobs.filter((j) => !j.fields.who.trim()).length;
    const m = el('div', 'm');
    m.innerHTML = `${n} job${n === 1 ? '' : 's'}`
      + (noRole ? ` · <span class="o">${noRole} with no role</span>` : '');
    row.appendChild(m);

    if (!S.readOnly && !isDrawer) {
      const tools = el('div', 'gtools');
      const at = real.indexOf(g);
      const up = mkTool('up', 'Move up', () => { moveGroup(S.doc, g, -1); S.dirty = true; render(); });
      up.disabled = at === 0;
      const dn = mkTool('down', 'Move down', () => { moveGroup(S.doc, g, 1); S.dirty = true; render(); });
      dn.disabled = at === real.length - 1;
      const ren = mkTool('pencil', 'Rename', () => doRenameGroup(g));
      const del = mkTool('trash', 'Delete this category', () => doDeleteGroup(g));
      del.className = 'danger';
      tools.appendChild(ren); tools.appendChild(up); tools.appendChild(dn); tools.appendChild(del);
      row.appendChild(tools);
    }
    return row;
  };

  for (const g of real) r.appendChild(item(g, false));

  if (!S.readOnly) {
    const add = el('button', 'rail-add', '+  New category');
    add.onclick = doAddGroup;
    r.appendChild(add);
  }
  if (drawer && drawer.jobs.length) r.appendChild(item(drawer, true));
}

function mkTool(glyph, title, onClick) {
  const b = document.createElement('button');
  b.title = title;
  b.appendChild(icon(glyph, 13));
  b.onclick = (e) => { e.stopPropagation(); onClick(); };
  return b;
}

function el(tag, cls, text) {
  const d = document.createElement(tag);
  if (cls) d.className = cls;
  if (text !== undefined && text !== null) d.textContent = text;
  return d;
}

function renderBar() {
  const bar = $('bar');
  bar.innerHTML = '';
  const add = (html) => { const d = document.createElement('div'); d.innerHTML = html; return bar.appendChild(d.firstElementChild); };

  add('<div class="brand">jobmap</div>');
  if (S.file) {
    // The filename is also how you change folders — no separate button for a
    // thing you do once a session.
    const f = add('<button class="file" title="Open a different folder"></button>');
    f.appendChild(icon('folder', 13));
    const fn = document.createElement('span');
    fn.textContent = S.file.name + (S.dirty ? ' \u00b7' : '');
    f.appendChild(fn);
    f.onclick = pickFolder;
  }
  if (S.readOnly) add('<div class="chip flag">read-only</div>');

  if (S.doc && countJobs(S.doc)) {
    const all = jobs();
    const n = all.filter((j) => j.fields.signoff).length;
    // A count, never a progress bar. This is not a thing you finish.
    // The most important fact about the file, in the one place always on screen.
    // It carries weight while it is still zero, and goes quiet once it is not.
    add(`<div class="coverage${n ? '' : ' none'}">${n ? `<b>${n}</b>` : 'None'} of ${all.length} signed off`
      + `</div>`);
  }
  add('<div class="spacer"></div>');

  // Two views, because there are two questions: what are the jobs, and who is
  // on the hook for them. A job's detail is not a peer of either — you get
  // there by clicking a job.
  if (S.doc) {
    const tabs = document.createElement('div');
    tabs.className = 'tabs';
    const LABEL = { jobs: 'Jobs', roles: 'Roles', source: 'Source' };
    for (const v of ['jobs', 'roles', 'source']) {
      const b = document.createElement('button');
      b.textContent = LABEL[v];
      b.className = (S.view === v || (v === 'jobs' && S.view === 'card')) ? 'on' : '';
      if (v === 'source') b.title = 'The markdown jobmap would write (S)';
      b.onclick = () => { S.view = v; render(); };
      tabs.appendChild(b);
    }
    bar.appendChild(tabs);
  }

  if (S.doc) {
    const cap = document.createElement('button');
    cap.className = 'btn' + (S.capture ? ' on' : '');
    cap.textContent = 'Capture';
    cap.title = 'Take statements at the speed people say them (C)';
    cap.onclick = () => setCapture(!S.capture);
    bar.appendChild(cap);

    const pres = document.createElement('button');
    pres.className = 'btn' + (S.present ? ' on' : '');
    pres.textContent = 'Present';
    pres.title = 'Big type for a shared screen (P)';
    pres.onclick = () => setPresent(!S.present);
    bar.appendChild(pres);
  }

  // Save appears when there is something to save, and not before.
  if (S.dirty && !S.readOnly) {
    const sv = document.createElement('button');
    sv.className = 'btn primary'; sv.textContent = 'Save';
    sv.onclick = save;
    bar.appendChild(sv);
  }
}

/**
 * Not-signed-off is the state of almost every job, so it gets no ink at all —
 * absence already means nobody has agreed it, exactly as the file means it.
 * Ink is spent on the one state that is news.
 */
function signChip(job) {
  return job.fields.signoff ? '<span class="chip signed">Signed off</span>' : '';
}
function whoChip(job) {
  return job.fields.who ? `<span class="chip who">${esc(job.fields.who)}</span>` : '';
}

function renderStage() {
  const st = $('stage');
  st.innerHTML = '';
  if (!S.dir) return renderWelcome(st);
  if (!S.doc) { st.innerHTML = '<div class="empty">Pick a file on the left.</div>'; return; }
  if (S.view === 'jobs') return renderJobs(st);
  if (S.view === 'roles') return renderRoles(st);
  if (S.view === 'card') return renderCard(st);
  return renderSource(st);
}

function renderWelcome(st) {
  st.innerHTML = `<div class="welcome">
    <h1>Open the folder holding your jobs file</h1>
    <p>jobmap edits one markdown file. The markdown stays the source of truth &mdash;
       it will not reformat a line you did not edit, and it will not write a file
       it cannot reproduce exactly.</p>
    <p><button class="btn primary big" id="pick">
         <svg width="16" height="14" viewBox="0 0 16 14" fill="none" aria-hidden="true"
              style="vertical-align:-2px;margin-right:7px">
           <path d="M1 3.2A1.7 1.7 0 0 1 2.7 1.5h3.1c.5 0 1 .23 1.32.63l.72.9h5.46A1.7 1.7 0 0 1 15 4.73v6.07a1.7 1.7 0 0 1-1.7 1.7H2.7A1.7 1.7 0 0 1 1 10.8V3.2Z"
                 stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
         </svg>Choose folder&hellip;</button></p>
    <p style="margin-top:22px"><code>Jobs (jobmap)/</code> beside your object map is a good home for it.</p>
  </div>`;
  $('pick').onclick = pickFolder;
}

/* Add a step at one stage of the job the map is showing. It lands in the same
   group as its parent, with the parent and stage already set — the two fields
   that put it on the map — and opens for editing. */
async function doRenameGroup(g) {
  const to = await ask({ title: 'Rename category', value: g.name, ok: 'Rename' });
  if (!to || to.trim() === g.name) return;
  if (groupsOf(S.doc).some((x) => x !== g && x.name.toLowerCase() === to.trim().toLowerCase())) {
    banner('warn', `There is already a category called <b>${esc(to.trim())}</b>.`);
    return;
  }
  if (S.group === g.name) S.group = to.trim();
  renameGroup(S.doc, g, to.trim());
  S.dirty = true; render();
}

async function doAddGroup() {
  const name = await ask({
    title: 'New category',
    body: 'Name it after a <b>group of people or an area of the business</b> \u2014 the way you would '
      + 'introduce it in a meeting.',
    value: '', placeholder: 'Producer Payments, Contracting, Scheduling\u2026', ok: 'Add'
  });
  if (!name) return;
  if (groupsOf(S.doc).some((g) => g.name.toLowerCase() === name.trim().toLowerCase())) {
    banner('warn', `There is already a category called <b>${esc(name.trim())}</b>.`);
    return;
  }
  const g = addGroup(S.doc, name.trim());
  S.dirty = true; S.group = g.name; S.view = 'jobs';
  render();
}

/**
 * Deleting a category is two different acts and the dialog says so, because one
 * of them loses work permanently and the other does not. There is no default
 * button that quietly picks the destructive one.
 */
async function doDeleteGroup(g) {
  const n = g.jobs.length;
  if (!n) {
    const go = await ask({
      title: `Delete \u201C${g.name}\u201D?`,
      body: 'It is empty, so nothing goes with it.', ok: 'Delete', danger: true
    });
    if (!go) return;
    removeGroup(S.doc, g, 'keep');
  } else {
    const choice = await ask({
      title: `Delete \u201C${g.name}\u201D?`,
      body: `It holds <b>${n} job${n === 1 ? '' : 's'}</b>. Keeping them moves them to `
        + `<b>${UNASSIGNED}</b>, where you can file them somewhere else. `
        + `Deleting them is permanent \u2014 they leave the file the next time you save `
        + `and there is no undo.`,
      ok: 'Keep the jobs', cancel: 'Cancel', alt: `Delete all ${n}`, danger: false
    });
    if (!choice) return;
    if (choice === 'alt') {
      const sure = await ask({
        title: `Permanently delete ${n} job${n === 1 ? '' : 's'}?`,
        body: 'This cannot be undone once you save. If you are not certain, cancel and keep them '
          + `in ${UNASSIGNED} instead.`,
        ok: `Yes, delete ${n}`, danger: true
      });
      if (!sure) return;
      removeGroup(S.doc, g, 'jobs');
    } else {
      removeGroup(S.doc, g, 'keep');
    }
  }
  S.dirty = true;
  if (S.group === g.name) S.group = (groupsOf(S.doc)[0] || {}).name || null;
  S.sel = 0; S.view = 'jobs';
  render();
}

async function doDeleteJob(job) {
  const steps = jobs().filter((j) => j.fields.parent && j.fields.parent === job.title);
  const go = await ask({
    title: `Delete \u201C${job.title || 'this job'}\u201D?`,
    body: 'It leaves the file the next time you save.'
      + (steps.length
          ? ` <b>${steps.length} step${steps.length === 1 ? '' : 's'}</b> name it as their parent —`
            + ' they stay, and their Parent is cleared so they are not left pointing at nothing.'
          : ''),
    ok: 'Delete', danger: true
  });
  if (!go) return;
  const at = S.sel;
  const r = removeJob(S.doc, job);
  if (!r.ok) return;
  S.dirty = true;
  const list = jobs();
  S.sel = Math.max(0, Math.min(at, list.length - 1));
  if (!list.length) S.view = 'jobs';
  render();
  banner('info', `Deleted <b>${esc(job.title || 'the job')}</b>.`
    + (r.orphans ? ` ${r.orphans} step${r.orphans === 1 ? '' : 's'} had their Parent cleared.` : '')
    + ' Save to write it to the file.');
}

function renderJobs(st) {
  const wrap = el('div', 'wrap');
  st.appendChild(wrap);

  const gs = groupsOf(S.doc);
  if (!gs.length) {
    wrap.appendChild(el('div', 'rail-empty', 'No categories yet. Add one on the left.'));
    return;
  }
  let seg = gs.find((g) => g.name === S.group);
  if (!seg) { seg = gs[0]; S.group = seg.name; }

  const head = el('div');
  head.style.cssText = 'margin-bottom:18px';
  const h = el('h1', 'g-title', seg.name);
  head.appendChild(h);
  const n = seg.jobs.length;
  const signed = seg.jobs.filter((j) => j.fields.signoff).length;
  const noRole = seg.jobs.filter((j) => !j.fields.who.trim()).length;
  head.appendChild(el('div', 'blurb',
    `${n} job${n === 1 ? '' : 's'}`
    + (signed ? ` \u00b7 ${signed} signed off` : '')
    + (noRole ? ` \u00b7 ${noRole} with nobody named` : '')));
  if (seg.name === UNASSIGNED) {
    head.appendChild(el('div', 'drawer-note',
      'These jobs have no category. Open one and move it somewhere it belongs.'));
  }
  wrap.appendChild(head);

  for (const job of seg.jobs) {
    const i = jobs().indexOf(job);
    const flags = lintJob(job);
    const row = el('div', 'job-row' + (i === S.sel ? ' on' : ''));
    row.innerHTML = `<div class="t"><b>${esc(job.title || 'Untitled job')}</b>`
      + `<span class="today">${esc(todayOf(job) || 'no note on how this works today')}</span></div>`
      + (flags.length ? '<span class="chip flag">reword</span>' : '')
      + whoChip(job) + signChip(job);
    row.onclick = () => { S.sel = i; S.view = 'card'; render(); };
    wrap.appendChild(row);
  }

  if (!S.readOnly) {
    const add = el('button', 'rail-add', '+  New job in ' + seg.name);
    add.style.cssText = 'margin-top:14px;max-width:320px';
    add.onclick = () => {
      const job = addJob(seg, { title: '', statement: null, saidBy: '', date: today() });
      S.dirty = true; S.sel = jobs().indexOf(job); S.view = 'card'; render();
      const t = document.querySelector('[data-k="title"]');
      if (t) t.focus();
    };
    wrap.appendChild(add);
  }

}

function renderCard(st) {
  const job = cur();
  if (!job) { st.innerHTML = '<div class="empty">No job selected.</div>'; return; }
  const list = jobs();
  const ro = S.readOnly;

  const wrap = document.createElement('div');
  wrap.className = 'wrap';
  st.appendChild(wrap);

  const card = document.createElement('div');
  card.className = 'card';

  const seg = groupsOf(S.doc).find((g) => g.jobs.includes(job));
  const sibs = seg ? seg.jobs : list;
  const at = sibs.indexOf(job);
  const goto = (k) => { S.sel = list.indexOf(sibs[k]); render(); };
  const nav = document.createElement('div');
  nav.className = 'nav';
  nav.innerHTML = `<button class="back">&larr; ${esc(seg ? seg.name : 'All jobs')}</button>`
    + `<span class="gap"></span>`
    + `<button ${at <= 0 ? 'disabled' : ''}>&lsaquo;</button>`
    + `<span>${at + 1} of ${sibs.length}</span>`
    + `<button ${at >= sibs.length - 1 ? 'disabled' : ''}>&rsaquo;</button>`;
  nav.children[0].onclick = () => { if (seg) S.group = seg.name; S.view = 'jobs'; render(); };
  nav.children[2].onclick = () => { if (at > 0) goto(at - 1); };
  nav.children[4].onclick = () => { if (at < sibs.length - 1) goto(at + 1); };
  card.appendChild(nav);

  const title = document.createElement('input');
  title.className = 'title'; title.value = job.title; title.disabled = ro;
  title.dataset.k = 'title';
  title.placeholder = 'Start with a verb \u2014 what are they trying to get done?';
  title.onchange = (e) => { job.title = e.target.value.trim(); markDirty(job, 'title'); keepPlace(render); };
  card.appendChild(title);

  const flags = lintJob(job);
  if (flags.length) {
    const f = document.createElement('div');
    f.className = 'flagbox';
    f.innerHTML = flags.map((i) => i.kind === 'smuggled-solution'
      ? `<b>This reads like today's process.</b> It mentions ${i.words.map((w) => `<b>${esc(w)}</b>`).join(', ')}. `
        + 'A job is what someone is trying to achieve regardless of how it is done now.'
      : '<b>This statement is not a situation, a need and an outcome.</b> It is kept exactly as written.'
    ).join('<br>');
    card.appendChild(f);
  }

  const stmt = el('div', 'stmt');
  if (job.statement.malformed && job.statement.raw) {
    const w = el('div', 'stmt-warn');
    w.innerHTML = '<b>This one is not in three parts yet.</b> The whole sentence is sitting in '
      + '<i>When</i>. Split it across the three boxes and the warning goes.';
    stmt.appendChild(w);
    if (!job.statement.when) { job.statement.when = job.statement.raw; }
  }
  const parts = [['when', 'When', job.statement.when],
                 ['need', 'I need', job.statement.need],
                 ['so', 'So that', job.statement.so]];
  for (const [k, label, val] of parts) {
    const d = el('div', 'part');
    d.appendChild(el('label', null, label));
    const ta = mkArea(val, ro, 'stmt-' + k);
    ta.onchange = (e) => {
      job.statement[k] = e.target.value.trim();
      job.statement.malformed = !(job.statement.when && job.statement.need && job.statement.so);
      job.statement.raw = '';
      markDirty(job, 'statement');
      keepPlace(render);
    };
    d.appendChild(ta);
    stmt.appendChild(d);
  }
  card.appendChild(stmt);

  const grid = el('div', 'grid two');
  grid.appendChild(mkRole(job, ro));
  grid.appendChild(mkCategory(job, ro));
  card.appendChild(grid);
  card.appendChild(mkDepends(job, ro));

  // Sign-off is the whole certainty model: agreed with the person who does the
  // job, or not agreed. Same bit ORCA uses, and for the same reason.
  const sg = document.createElement('label');
  sg.className = 'signrow' + (job.fields.signoff ? ' on' : '');
  const cb = document.createElement('input');
  cb.type = 'checkbox'; cb.checked = !!job.fields.signoff; cb.disabled = ro;
  cb.onchange = () => {
    job.fields.signoff = cb.checked ? 'signed ' + today() : '';
    markDirty(job, 'fields'); keepPlace(render);
  };
  const sl = document.createElement('span');
  sl.innerHTML = job.fields.signoff
    ? `Signed off <span class="signwhen">${esc(job.fields.signoff.replace(/^signed /, ''))}</span>`
    : 'Signed off';
  sg.appendChild(cb); sg.appendChild(sl);
  card.appendChild(sg);

  // How often and how long belong together, and share one hint rather than
  // saying the same sentence twice side by side.
  card.appendChild(mkFrequency(job, ro));

  const pair = document.createElement('div');
  pair.className = 'pair one';
  pair.appendChild(mkInput('How long it takes', job.fields.duration, ro, 'dur',
    (v) => { job.fields.duration = v; markDirty(job, 'fields'); keepPlace(render); }));
  card.appendChild(pair);

  const bl = document.createElement('label');
  bl.style.cssText = 'display:block;font-size:var(--t-micro);font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--faint);margin:22px 0 5px';
  bl.textContent = 'Notes';
  card.appendChild(bl);
  const body = document.createElement('textarea');
  body.className = 'body-edit'; body.value = job.bodySrc.join('\n'); body.disabled = ro;
  body.dataset.k = 'body';
  body.onchange = (e) => { job.bodySrc = e.target.value.split('\n'); markDirty(job, 'body'); keepPlace(render); };
  card.appendChild(body);

  // Delete sits at the bottom, behind a confirm, and away from everything you
  // touch while editing — the same place and the same weight ORCA gives it.
  if (!ro) {
    const foot = document.createElement('div');
    foot.className = 'cardfoot';
    const del = document.createElement('button');
    del.className = 'delbtn';
    del.appendChild(icon('trash', 13));
    del.appendChild(document.createTextNode('Delete this job'));
    del.onclick = () => doDeleteJob(job);
    foot.appendChild(del);
    card.appendChild(foot);
  }

  wrap.appendChild(card);
}

function mkArea(val, ro, key) {
  const ta = document.createElement('textarea');
  ta.value = val || ''; ta.disabled = ro; ta.rows = 1; ta.dataset.k = key;
  const fit = () => { ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 'px'; };
  ta.addEventListener('input', fit);
  setTimeout(fit, 0);
  // Enter commits rather than inserting a newline: a statement is one sentence.
  ta.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); ta.blur(); } });
  return ta;
}
function mkField(label, hint) {
  const d = document.createElement('div');
  d.className = 'f';
  d.innerHTML = `<label>${label}</label>`;
  if (hint) d.dataset.hint = hint;
  return d;
}
function mkInput(label, val, ro, key, onSet, hint) {
  const d = mkField(label, hint);
  const i = document.createElement('input');
  i.value = val || ''; i.disabled = ro; i.dataset.k = key;
  i.onchange = (e) => onSet(e.target.value.trim());
  d.appendChild(i);
  if (hint) { const h = document.createElement('div'); h.className = 'hint'; h.textContent = hint; d.appendChild(h); }
  return d;
}
/* One glyph set across jobmap, priority-guide and ORCA — same viewBox, same
   stroke weight, same call. Copied rather than shared because these apps have
   no build step and each is a single file you can open anywhere. */
const GLYPH = {
  folder: 'M1.5 3.5h4.2l1.4 2h7.4v7.5a1 1 0 01-1 1H2.5a1 1 0 01-1-1z',
  trash: 'M2.5 4.5h11M6 4.5V3a1 1 0 011-1h2a1 1 0 011 1v1.5M4 4.5l.6 8a1 1 0 001 .9h4.8a1 1 0 001-.9l.6-8',
  up: 'M8 12.5v-9M4 7.5L8 3.5l4 4',
  down: 'M8 3.5v9M4 8.5l4 4 4-4',
  x: 'M4 4l8 8M12 4l-8 8',
  plus: 'M8 3.5v9M3.5 8h9',
  pencil: 'M11.3 2.7l2 2L6 12H4v-2zM10 4l2 2'
};
function icon(name, size = 14) {
  const NS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(NS, 'svg');
  svg.setAttribute('viewBox', '0 0 16 16');
  svg.setAttribute('width', size);
  svg.setAttribute('height', size);
  svg.setAttribute('fill', 'none');
  svg.setAttribute('stroke', 'currentColor');
  svg.setAttribute('stroke-width', '1.4');
  svg.setAttribute('stroke-linecap', 'round');
  svg.setAttribute('stroke-linejoin', 'round');
  svg.style.flex = 'none';
  svg.style.display = 'block';
  const p = document.createElementNS(NS, 'path');
  p.setAttribute('d', GLYPH[name] || GLYPH.folder);
  svg.appendChild(p);
  return svg;
}

/**
 * Who does it. A free-text box would let "Payments team", "Payments Team" and
 * "paymnets team" become three roles that are one role, and the whole point of
 * the roles view is that they are not. So: pick from the roles already in the
 * file, or add one — and adding one is deliberate rather than a side effect of
 * typing.
 */
function mkRole(job, ro) {
  const d = mkField('Who does it');
  const known = roles(S.doc).map((r) => r.name);
  const sel = document.createElement('select');
  sel.className = 'cell'; sel.dataset.k = 'who'; sel.disabled = ro;
  const opts = ['', ...known];
  if (job.fields.who && !known.includes(job.fields.who)) opts.push(job.fields.who);
  for (const o of opts) {
    const el2 = document.createElement('option');
    el2.value = o; el2.textContent = o || 'Nobody named yet';
    if (o === job.fields.who) el2.selected = true;
    sel.appendChild(el2);
  }
  const addOpt = document.createElement('option');
  addOpt.value = '__new'; addOpt.textContent = '+ Add a role\u2026';
  sel.appendChild(addOpt);
  sel.onchange = async () => {
    if (sel.value !== '__new') {
      job.fields.who = sel.value; markDirty(job, 'fields'); keepPlace(render); return;
    }
    const name = await ask({
      title: 'Add a role',
      body: 'The role, not the person \u2014 <b>Payments</b>, not <b>Priya</b>. '
        + 'It joins the list for every other job.',
      value: '', placeholder: 'Payments, Contracting, Scheduling\u2026', ok: 'Add'
    });
    if (!name) { sel.value = job.fields.who; return; }
    const exists = known.find((k) => k.toLowerCase() === name.trim().toLowerCase());
    job.fields.who = exists || name.trim();
    markDirty(job, 'fields');
    keepPlace(render);
  };
  d.appendChild(sel);
  return d;
}

/** Which category this job sits in — the move-a-job-between-categories path. */
function mkCategory(job, ro) {
  const d = mkField('Category');
  const gs = groupsOf(S.doc);
  const here = gs.find((g) => g.jobs.includes(job));
  const sel = document.createElement('select');
  sel.className = 'cell'; sel.dataset.k = 'cat'; sel.disabled = ro;
  for (const g of gs) {
    const o = document.createElement('option');
    o.value = g.name; o.textContent = g.name;
    if (here && g === here) o.selected = true;
    sel.appendChild(o);
  }
  sel.onchange = () => {
    const to = gs.find((g) => g.name === sel.value);
    if (!to || !moveJob(S.doc, job, to)) return;
    S.dirty = true; S.group = to.name;
    S.sel = jobs().indexOf(job);
    keepPlace(render);
    banner('info', `Moved to <b>${esc(to.name)}</b>.`);
  };
  d.appendChild(sel);
  return d;
}

/**
 * Depends on. Not a parent: several jobs can block this one, and none of them
 * owns it. Chips, so it is obvious there can be more than one.
 */
function mkDepends(job, ro) {
  const d = mkField('Depends on');
  const cur = splitDeps(job.fields.depends);
  const chips = el('div', 'chips');
  cur.forEach((name, i) => {
    const c = el('span', 'chip dep');
    const live = jobs().some((j) => j.title === name);
    c.appendChild(el('span', null, name));
    if (!live) { const g = el('span', 'gone'); g.textContent = 'no such job'; c.appendChild(g); }
    if (!ro) {
      const x = document.createElement('button');
      x.className = 'chipx'; x.title = 'Remove'; x.appendChild(icon('x', 9));
      x.onclick = () => {
        const keep = cur.filter((_, k) => k !== i);
        job.fields.depends = joinDeps(keep);
        markDirty(job, 'fields'); keepPlace(render);
      };
      c.appendChild(x);
    }
    chips.appendChild(c);
  });
  if (!ro) {
    const pick = document.createElement('select');
    pick.className = 'depadd';
    const first = document.createElement('option');
    first.value = ''; first.textContent = cur.length ? '+ another' : '+ add a job this waits on';
    pick.appendChild(first);
    for (const j of jobs()) {
      if (j === job || cur.includes(j.title) || !j.title) continue;
      const o = document.createElement('option');
      o.value = j.title; o.textContent = j.title;
      pick.appendChild(o);
    }
    pick.onchange = () => {
      if (!pick.value) return;
      job.fields.depends = joinDeps([...cur, pick.value]);
      markDirty(job, 'fields'); keepPlace(render);
    };
    chips.appendChild(pick);
  }
  if (!cur.length && ro) chips.appendChild(el('span', 'none', 'Nothing'));
  d.appendChild(chips);
  return d;
}

/**
 * How often. Five shapes, because "every 2 weeks", "the 3rd Thursday" and "the
 * 5th and the 25th" are different KINDS of answer, and a text box flattens them
 * into prose you cannot group by afterwards.
 *
 * The fifth is "irregular", free text, and it is not a cop-out: most of these
 * jobs fire when a file lands or a producer calls. Making those pick a calendar
 * would record a schedule nobody keeps.
 */
const FREQ_KIND_LABEL = {
  '': 'Not asked',
  every: 'Every\u2026',
  nth: 'A weekday of the month\u2026',
  days: 'Set days of the month\u2026',
  date: 'One specific date\u2026',
  irregular: 'Irregular \u2014 describe it'
};

function mkFrequency(job, ro) {
  const stored = parseFrequency(job.fields.frequency);
  const f = (job._freqKind && job._freqKind !== stored.kind && !job.fields.frequency)
    ? { kind: job._freqKind, n: 1, unit: 'week', ordinal: '1st', weekday: 'Monday', days: [], text: '' }
    : stored;
  const d = mkField('How often');
  const row = el('div', 'freq');

  const put = (next) => {
    job._freqKind = next.kind;
    job.fields.frequency = renderFrequency(next);
    markDirty(job, 'fields');
    keepPlace(render);
  };
  const sel = (val, opts, onChange, cls) => {
    const s2 = document.createElement('select');
    s2.className = 'cell ' + (cls || '');
    s2.disabled = ro;
    for (const o of opts) {
      const op = document.createElement('option');
      op.value = o.v; op.textContent = o.t;
      if (String(o.v) === String(val)) op.selected = true;
      s2.appendChild(op);
    }
    s2.onchange = () => onChange(s2.value);
    return s2;
  };

  const kind = sel(f.kind, Object.keys(FREQ_KIND_LABEL).map((k) => ({ v: k, t: FREQ_KIND_LABEL[k] })),
    (v) => {
      if (v === '') return put({ kind: '' });
      if (v === 'every') return put({ kind: 'every', n: 1, unit: 'week' });
      if (v === 'nth') return put({ kind: 'nth', ordinal: '1st', weekday: 'Monday' });
      if (v === 'days') return put({ kind: 'days', days: [1] });
      if (v === 'date') return put({ kind: 'date', date: today() });
      return put({ kind: 'irregular', text: '' });
    }, 'kind');
  kind.dataset.k = 'freq-kind';
  row.appendChild(kind);

  if (f.kind === 'every') {
    const n = document.createElement('input');
    n.type = 'number'; n.min = '1'; n.max = '99'; n.value = f.n; n.className = 'cell num';
    n.disabled = ro;
    n.onchange = () => put({ ...f, n: Math.max(1, Number(n.value) || 1) });
    row.appendChild(n);
    row.appendChild(sel(f.unit, FREQ_UNITS.map((u) => ({ v: u, t: f.n === 1 ? u : u + 's' })),
      (v) => put({ ...f, unit: v })));
  } else if (f.kind === 'nth') {
    row.appendChild(sel(f.ordinal, FREQ_ORDINALS.map((o) => ({ v: o, t: o })),
      (v) => put({ ...f, ordinal: v })));
    row.appendChild(sel(f.weekday, WEEKDAYS.map((w) => ({ v: w, t: w })),
      (v) => put({ ...f, weekday: v })));
    row.appendChild(el('span', 'freq-lbl', 'of the month'));
  } else if (f.kind === 'days') {
    const box = el('div', 'daybox');
    for (let i = 1; i <= 31; i++) {
      const b = document.createElement('button');
      b.className = 'day' + ((f.days || []).includes(i) ? ' on' : '');
      b.textContent = i; b.disabled = ro;
      b.onclick = () => {
        const cur = new Set(f.days || []);
        cur.has(i) ? cur.delete(i) : cur.add(i);
        put({ ...f, days: [...cur] });
      };
      box.appendChild(b);
    }
    row.appendChild(box);
  } else if (f.kind === 'date') {
    const dt = document.createElement('input');
    dt.type = 'date'; dt.value = f.date || ''; dt.className = 'cell'; dt.disabled = ro;
    dt.onchange = () => put({ ...f, date: dt.value });
    row.appendChild(dt);
  } else if (f.kind === 'irregular') {
    const tx = document.createElement('input');
    tx.className = 'cell grow'; tx.value = f.text || ''; tx.disabled = ro;
    tx.placeholder = 'when a file lands, when a producer calls\u2026';
    tx.onchange = () => put({ ...f, text: tx.value });
    row.appendChild(tx);
  }

  d.appendChild(row);
  if (job.fields.frequency) {
    d.appendChild(el('div', 'freq-out', renderFrequency(f)));
  }
  return d;
}

function mkSelect(label, val, opts, ro, key, onSet, hint, emptyLabel, labelFor) {
  const d = mkField(label, hint);
  const s = document.createElement('select');
  s.disabled = ro; s.dataset.k = key;
  for (const o of opts) {
    const el = document.createElement('option');
    el.value = o;
    el.textContent = o ? (labelFor ? labelFor(o) : o) : (emptyLabel || '\u2014');
    if (o === val) el.selected = true;
    s.appendChild(el);
  }
  s.onchange = (e) => onSet(e.target.value);
  d.appendChild(s);
  if (hint) { const h = document.createElement('div'); h.className = 'hint'; h.textContent = hint; d.appendChild(h); }
  return d;
}

/**
 * Every role, and what each one is on the hook for. Same shape as
 * priority-guide's users view: a block per group, a count, and one button that
 * narrows the whole app to them so a session can be walked role by role.
 */
function renderRoles(st) {
  const wrap = el('div', 'wrap');
  st.appendChild(wrap);
  const rs = roles(S.doc);
  const none = unroled(S.doc);

  const head = el('div');
  head.style.cssText = 'margin-bottom:22px';
  head.appendChild(el('h1', 'g-title',
    rs.length ? `${rs.length} role${rs.length === 1 ? '' : 's'}` : 'No roles yet'));
  head.appendChild(el('div', 'blurb', rs.length
    ? 'Who is on the hook for what. Pick one to take only their jobs into a conversation.'
    : 'Open a job and name who does it. Every role you add shows up here and in the picker on every other job.'));
  wrap.appendChild(head);

  for (const r of rs) {
    const box = el('div', 'usr');
    const h = el('div', 'usr-h');
    h.appendChild(el('span', 'n', r.name));
    h.appendChild(el('span', 'm', `${r.jobs.length} job${r.jobs.length === 1 ? '' : 's'}`));
    const sign = r.jobs.filter((j) => j.fields.signoff).length;
    h.appendChild(el('span', 'm', sign ? `${sign} signed off` : 'none signed off'));
    box.appendChild(h);
    for (const j of r.jobs) {
      const b = el('button', 'oi');
      b.appendChild(el('div', 't', j.title || 'Untitled job'));
      const cat = groupsOf(S.doc).find((g) => g.jobs.includes(j));
      if (cat) b.appendChild(el('div', 'c', cat.name));
      b.onclick = () => { S.sel = jobs().indexOf(j); S.view = 'card'; render(); };
      box.appendChild(b);
    }
    wrap.appendChild(box);
  }

  if (none.length) {
    const box = el('div', 'usr drawer');
    const h = el('div', 'usr-h');
    h.appendChild(el('span', 'n', 'Nobody named'));
    h.appendChild(el('span', 'm', `${none.length} job${none.length === 1 ? '' : 's'}`));
    box.appendChild(h);
    box.appendChild(el('div', 'blurb',
      'The gap this view exists to show. Until a job has a role on it, there is nobody to read it back.'));
    for (const j of none) {
      const b = el('button', 'oi');
      b.appendChild(el('div', 't', j.title || 'Untitled job'));
      b.onclick = () => { S.sel = jobs().indexOf(j); S.view = 'card'; render(); };
      box.appendChild(b);
    }
    wrap.appendChild(box);
  }
}

function renderSource(st) {
  const wrap = document.createElement('div');
  wrap.className = 'wrap';
  st.appendChild(wrap);
  st = wrap;
  const head = el('div');
  head.style.cssText = 'margin-bottom:14px';
  head.appendChild(el('h1', 'g-title', 'Source'));
  head.appendChild(el('div', 'blurb',
    'Exactly what jobmap would write to the file. Read-only \u2014 edit in the Jobs view, or in Obsidian.'));
  st.appendChild(head);
  const pre = document.createElement('pre');
  pre.className = 'src';
  pre.textContent = serializeDocument(S.doc);
  st.appendChild(pre);
}

// ---------------------------------------------------------------- facilitation
/*
 * A jobs list is argued into existence in a room, not typed alone. Present mode
 * makes it readable on a shared screen; capture takes statements at the speed
 * people say them; the referee says the awkward part so the facilitator does
 * not have to.
 */
function setPresent(on) {
  S.present = on;
  document.body.toggleAttribute('data-present', on);
  render();
}

/* The one dialog, same shape as ORCA's. Returns a promise: false/null on
   cancel, true on confirm, the typed string when `value` is given. */
function ask(o) {
  return new Promise((resolve) => {
    const prompting = typeof o.value === 'string';
    const scrim = document.createElement('div');
    scrim.className = 'scrim';
    scrim.innerHTML = `<div class="dlg" role="dialog" aria-modal="true" aria-label="${esc(o.title)}">`
      + `<h2>${esc(o.title)}</h2>`
      + (o.body ? `<p>${o.body}</p>` : '')
      + (prompting ? `<input value="${esc(o.value)}"${o.placeholder ? ` placeholder="${esc(o.placeholder)}"` : ''}>` : '')
      + `<div class="acts">`
      +   `<button class="btn" data-a="no">${esc(o.cancel || 'Cancel')}</button>`
      +   (o.alt ? `<button class="btn danger" data-a="alt">${esc(o.alt)}</button>` : '')
      +   `<button class="btn ${o.danger ? 'danger' : 'primary'}" data-a="yes">${esc(o.ok || 'OK')}</button>`
      + `</div></div>`;
    document.body.appendChild(scrim);
    const inp = scrim.querySelector('input');
    const altBtn = scrim.querySelector('[data-a=alt]');
    const prior = document.activeElement;
    let done = false;
    const close = (v) => {
      if (done) return;
      done = true;
      dialogsOpen--;
      document.removeEventListener('keydown', key, true);
      scrim.remove();
      if (prior && prior.isConnected && prior.focus) prior.focus();
      resolve(v);
    };
    const no = () => close(prompting ? null : false);
    const yes = () => close(prompting ? (inp.value.trim() || null) : true);
    const alt = () => close('alt');
    const key = (e) => {
      if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); no(); return; }
      if (e.key !== 'Enter') return;
      const a = document.activeElement;
      if (a && a.dataset && (a.dataset.a === 'no' || a.dataset.a === 'alt')) return;
      e.preventDefault(); e.stopPropagation(); yes();
    };
    dialogsOpen++;
    document.addEventListener('keydown', key, true);
    scrim.querySelector('[data-a=no]').onclick = no;
    scrim.querySelector('[data-a=yes]').onclick = yes;
    if (altBtn) altBtn.onclick = alt;
    scrim.onmousedown = (e) => { if (e.target === scrim) no(); };
    if (inp) { inp.focus(); inp.select(); } else scrim.querySelector('[data-a=yes]').focus();
  });
}
let dialogsOpen = 0;

function setCapture(on) {
  S.capture = on;
  document.body.toggleAttribute('data-capture', on);
  if (on) {
    renderCapture();
    setTimeout(() => $('capText').focus(), 0);
  } else {
    $('capLint').classList.remove('on');
  }
  render();
}

/* Wired once. The dialog closes on Done, on Escape, and on a click that STARTS
   on the backdrop — never on a drag that merely ends there. */
$('capDone').onclick = () => setCapture(false);
$('capScrim').onmousedown = (e) => { if (e.target === $('capScrim')) setCapture(false); };

function groups() { return S.doc ? S.doc.segments.filter((x) => x.kind === 'group') : []; }

function renderCapture() {
  const sel = $('capGroup');
  const gs = groups();
  const prev = S.capGroup;
  sel.innerHTML = '';
  for (const g of gs) {
    const o = document.createElement('option');
    o.value = g.name; o.textContent = g.name;
    sel.appendChild(o);
  }
  const nw = document.createElement('option');
  nw.value = '__new'; nw.textContent = '+ new group…';
  sel.appendChild(nw);
  if (prev && gs.some((g) => g.name === prev)) sel.value = prev;
  else if (gs.length) { S.capGroup = gs[0].name; sel.value = S.capGroup; }
  $('capCount').textContent = S.captured.length
    ? `${S.captured.length} captured this session` : 'Nothing captured yet';
  renderRecent();
}

function renderRecent() {
  const box = $('capRecent');
  box.innerHTML = '';
  if (!S.captured.length) return;
  box.appendChild(el('div', 'recent-h', 'Added to this file'));
  for (const c of S.captured.slice(-5).reverse()) {
    const here = groupsOf(S.doc).find((g) => g.jobs.includes(c.job));
    const where = here ? here.name : c.group;
    const d = el('div', 'recent');
    d.innerHTML = `<span class="tick">\u2713</span><b>${esc(c.title)}</b>`
      + `<span class="where">${esc(where)}${c.who ? ' \u00b7 ' + esc(c.who) : ''}</span>`;
    box.appendChild(d);
  }
}

/** Live referee: flag today's process before it becomes a job, as a question. */
function refereeCheck(text) {
  const box = $('capLint');
  const t = String(text || '').trim();
  if (!t) { box.classList.remove('on'); box.innerHTML = ''; return; }
  const issues = lintJob({ statement: parseStatement(t), fields: {} });
  const smug = issues.find((i) => i.kind === 'smuggled-solution');
  if (!smug) { box.classList.remove('on'); box.innerHTML = ''; return; }
  const words = smug.words.map((w) => `<b>${esc(w)}</b>`).join(', ');
  box.innerHTML = `<div class="referee">${words} — that is how it is done today, not what they are `
    + `trying to achieve. <b>Ask: and what does that get you?</b></div>`;
  box.classList.add('on');
}

/* Captured statements are sentence-style ("fix the thing"); only the leading
   letter needs raising to match hand-authored titles — the rest of the
   sentence stays as said. */
function capFirst(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }

function doCapture() {
  const input = $('capText');
  const text = input.value.trim();
  if (!text || !S.doc || S.readOnly) return;

  let group = groups().find((g) => g.name === S.capGroup);
  if (!group) group = groups()[0];
  if (!group) group = addGroup(S.doc, 'Captured in session');

  const who = $('capWho').value.trim();
  const looksFull = /,\s*i need\s/i.test(text);
  const title = capFirst(looksFull ? text.replace(/^when\s+/i, '').split(/,\s*i need/i)[0].trim() : text);
  const job = addJob(group, {
    title,
    statement: looksFull ? text : null,
    saidBy: who,
    date: new Date().toISOString().slice(0, 10)
  });
  S.captured.push({ title: job.title, who, group: group.name, job });
  S.dirty = true;
  input.value = '';
  refereeCheck('');
  renderCapture();
  render();
  input.focus();
}

$('capText').addEventListener('input', (e) => refereeCheck(e.target.value));
$('capText').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') { e.preventDefault(); doCapture(); }
  if (e.key === 'Escape') { e.preventDefault(); setCapture(false); }
});
$('capGroup').addEventListener('change', async (e) => {
  if (e.target.value === '__new') {
    const name = await ask({
      title: 'New group',
      body: 'Name it after a <b>user population</b> \u2014 the people who do these jobs \u2014 '
        + 'not a feature area.',
      value: '', placeholder: 'Payments team, Contracting, Producers\u2026', ok: 'Add'
    });
    if (name && name.trim()) { addGroup(S.doc, name.trim()); S.capGroup = name.trim(); S.dirty = true; }
    renderCapture(); render();
    $('capText').focus();
    return;
  }
  S.capGroup = e.target.value;
});

// ---------------------------------------------------------------- keyboard
document.addEventListener('keydown', (e) => {
  if (dialogsOpen) return;
  const t = e.target;
  const typing = t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT');
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 's') { e.preventDefault(); save(); return; }
  if (e.key === 'Escape' && S.present) { e.preventDefault(); setPresent(false); return; }
  if (typing || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === 'p' || e.key === 'P') { e.preventDefault(); setPresent(!S.present); return; }
  if (e.key === 's' || e.key === 'S') { e.preventDefault(); S.view = S.view === 'source' ? 'jobs' : 'source'; render(); return; }
  if (e.key === 'c' || e.key === 'C') { e.preventDefault(); setCapture(!S.capture); return; }
  if (e.key === 'ArrowLeft' && S.sel > 0) { S.sel--; render(); }
  if (e.key === 'ArrowRight' && S.sel < jobs().length - 1) { S.sel++; render(); }
});

window.addEventListener('beforeunload', (e) => { if (S.dirty) { e.preventDefault(); e.returnValue = ''; } });

// ---------------------------------------------------------------- boot
(async function boot() {
  if (typeof window.showDirectoryPicker !== 'function') {
    banner('err', '<b>This browser cannot open local folders.</b> Use Chrome, Edge, Arc or Brave.', true);
    return;
  }
  if (location.protocol === 'file:') {
    banner('err', '<b>Opened as a file, not over http.</b> Run <code>jobmap</code> from a terminal instead.', true);
    return;
  }
  render();
  const saved = await kvGet('folder');
  if (saved) {
    try {
      if ((await saved.queryPermission({ mode: 'readwrite' })) === 'granted') { S.dir = saved; await loadFolder(); return; }
      banner('info', '<b>Reopen your folder</b> to let jobmap read it again.', true);
    } catch { /* the grant lapsed */ }
  }
  render();
})();
</script>
</body>
</html>
